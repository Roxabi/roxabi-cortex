[project]
name = "cortex-memory"
version = "0.1.0"
description = "cortex-memory — long-term memory satellite (MVP NATS capture/search/assemble)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "roxabi-contracts",
    "roxabi-nats",
    "nats-py>=2.6,<3",
    "nkeys>=0.1",
    "pydantic>=2",
]

[project.scripts]
cortex-memory = "cortex_memory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_memory"]

# Resolved from git: a sibling-directory path only exists on a developer
# machine, so CI could never build this package.
[tool.uv.sources]
roxabi-contracts = { git = "https://github.com/Roxabi/roxabi-factory.git", subdirectory = "packages/roxabi-contracts", branch = "staging" }
roxabi-nats = { git = "https://github.com/Roxabi/roxabi-factory.git", subdirectory = "packages/roxabi-nats", branch = "staging" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
